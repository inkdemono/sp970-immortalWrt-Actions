name: SP970 ImmortalWrt Builder

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable TMate remote debugging (true/false)'
        required: false
        default: 'false'
      clean_cache:
        description: 'Force clean build cache (true/false)'
        required: false
        default: 'false'

# 🔑 核心权限：允许创建 Release 并上传文件
permissions:
  contents: write
  actions: read

env:
  # 源码配置
  REPO_URL: https://github.com/lkiuyu/immortalwrt
  REPO_BRANCH: master
  
  # 配置文件
  CONFIG_FILE: sp970.config
  FEEDS_CONF: feeds.conf.default
  
  # 构建选项
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  UPLOAD_BIN_DIR: false
  
  # 时区与路径
  TZ: Asia/Shanghai
  WORK_DIR: /mnt/workdir

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360  # 6 小时超时，避免长时间编译被中断

    steps:
    # ==========================================
    # 1️⃣ Checkout & Environment
    # ==========================================
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize build environment
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
          gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
          libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
          libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch \
          pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons \
          squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto \
          xxd zlib1g-dev mkbootimg img2simg
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p "$WORK_DIR"
        sudo chown $USER:$GROUPS "$WORK_DIR"
        df -hT "$WORK_DIR"

    # ==========================================
    # 2️⃣ Optional Debug Session (TMate)
    # ==========================================
    - name: Setup TMate Session (Optional)
      if: github.event.inputs.debug_enabled == 'true'
      uses: mxschmitt/action-tmate@v3
      with:
        detached: true
        limit-access-to-actor: true
        tmate-session-token: ${{ secrets.TMATE_TOKEN }}

    # ==========================================
    # 3️⃣ Clone Source & Link Workspace
    # ==========================================
    - name: Clone ImmortalWrt source
      working-directory: ${{ env.WORK_DIR }}
      run: |
        git clone --depth 1 ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt
        ln -sf ${{ env.WORK_DIR }}/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt
        echo "✅ Source cloned: $(git rev-parse --short HEAD)"

    # ==========================================
    # 4️⃣ Load Custom Feeds (Critical for daed/cloudflared)
    # ==========================================
    - name: Configure custom feeds
      run: |
        cd openwrt
        # 备份原始配置
        cp feeds.conf.default feeds.conf.default.bak
        
        # 添加第三方 feeds (daed, small, passwall-packages)
        cat >> feeds.conf.default << 'EOF'
        src-git daed https://github.com/sbwml/luci-app-daed
        src-git small https://github.com/kenzok8/small
        src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages
        EOF
        
        # 更新并安装所有 feeds
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        # 验证关键包是否被识别
        echo "🔍 Checking critical packages..."
        ./scripts/feeds list -n 2>/dev/null | grep -E "daed|cloudflared|tailscale|zerotier" || \
          echo "⚠️ Some packages may not be found in feeds"

    # ==========================================
    # 5️⃣ Load & Sanitize Configuration
    # ==========================================
    - name: Load diffconfig
      run: |
        if [ -f "${{ env.CONFIG_FILE }}" ]; then
          cp "${{ env.CONFIG_FILE }}" openwrt/.config
          echo "✅ Config file loaded: ${{ env.CONFIG_FILE }}"
        else
          echo "❌ Config file not found: ${{ env.CONFIG_FILE }}"
          exit 1
        fi

    # ==========================================
    # 6️⃣ Pre-compile Fixes (GCC14/musl + Podman)
    # ==========================================
    - name: Apply compatibility patches
      run: |
        cd openwrt
        
        # 🛡️ 修复 GCC14 + musl + _FORTIFY_SOURCE 导致的 gpgme 编译失败
        # Podman 仅依赖 gpgme 做镜像签名验证，家用场景可安全移除
        echo "🔧 Patching podman to remove gpgme dependency..."
        if [ -f "feeds/packages/utils/podman/Makefile" ]; then
          sed -i 's/+gpgme//' feeds/packages/utils/podman/Makefile
          echo "✅ Podman gpgme dependency removed"
        fi
        
        # 显式禁用 gpgme 及相关包，避免符号冲突
        cat >> .config << 'EOF'
        # GCC14/musl compatibility: disable problematic crypto packages
        # CONFIG_PACKAGE_gpgme is not set
        # CONFIG_PACKAGE_libgpg-error is not set
        # CONFIG_PACKAGE_libgcrypt is not set
        # CONFIG_PACKAGE_libassuan is not set
        # CONFIG_PACKAGE_npth is not set
        EOF
        
        # 清理旧缓存（可选）
        if [ "${{ github.event.inputs.clean_cache }}" = "true" ]; then
          echo "🧹 Cleaning build cache..."
          rm -rf tmp/staging_dir/host* tmp/.config-package.in build_dir/target-*/gpgme*
        fi

    # ==========================================
    # 7️⃣ Generate Final Configuration
    # ==========================================
    - name: Generate final .config
      run: |
        cd openwrt
        # 自动解析配置，丢弃无效符号，避免交互阻塞
        make defconfig 2>/dev/null || make olddefconfig 2>/dev/null || true
        
        # 验证关键配置
        echo "🔍 Validating configuration..."
        if grep -q "CONFIG_TARGET_msm89xx_generic_DEVICE_sp970=y" .config; then
          echo "✅ SP970 device target: OK"
        else
          echo "❌ SP970 device target: MISSING"
          grep "CONFIG_TARGET.*sp970" .config || true
          exit 1
        fi
        
        if grep -q "CONFIG_PACKAGE_daed=y" .config; then
          echo "✅ Daed package: OK"
        else
          echo "⚠️ Daed package: not enabled (check feeds)"
        fi
        
        # 输出配置摘要
        echo "📋 Config summary:"
        grep -E "^CONFIG_(TARGET_|PACKAGE_(daed|tailscale|zerotier|podman|kmod-sched-bpf))=" .config | head -20

    # ==========================================
    # 8️⃣ Download Sources
    # ==========================================
    - name: Download package sources
      run: |
        cd openwrt
        make download -j8
        # 清理损坏的下载文件
        find dl -size -1024c -exec rm -f {} \; || true
        echo "✅ Downloads complete"

    # ==========================================
    # 9️⃣ Compile Firmware (Multi-level fallback)
    # ==========================================
    - name: Compile firmware
      id: compile
      run: |
        cd openwrt
        echo "🧵 Build threads: $(nproc)"
        echo "💾 Disk space before build:"
        df -hT .
        
        # 三级编译策略：并行 → 单线程 → 详细日志
        if make -j$(nproc) IGNORE_ERRORS=m 2>&1 | tee build.log; then
          echo "✅ Build succeeded (parallel)"
        elif make -j1 IGNORE_ERRORS=m 2>&1 | tee -a build.log; then
          echo "✅ Build succeeded (single-thread fallback)"
        elif make -j1 V=s IGNORE_ERRORS=m 2>&1 | tee -a build.log; then
          echo "✅ Build succeeded (verbose fallback)"
        else
          echo "❌ Build failed after all attempts"
          echo "🔍 Last 100 lines of build.log:"
          tail -100 build.log
          exit 1
        fi
        
        # 标记成功并提取元数据
        echo "status=success" >> $GITHUB_OUTPUT
        DEVICE=$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' | head -1)
        echo "DEVICE_NAME=_${DEVICE:-sp970}" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "OPENWRT_VERSION=$(git -C . describe --tags --always 2>/dev/null || echo 'master')" >> $GITHUB_ENV

    # ==========================================
    # 🔟 Post-build Checks
    # ==========================================
    - name: Check build outputs
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        echo "📦 Firmware files:"
        ls -lh *sysupgrade.bin *boot.img *system.img 2>/dev/null || true
        
        echo "🔐 SHA256 checksums:"
        sha256sum *sysupgrade.bin 2>/dev/null || true
        
        echo "💾 Disk usage after build:"
        df -hT .

    # ==========================================
    # 1️⃣1️⃣ Organize & Upload Artifacts
    # ==========================================
    - name: Organize firmware files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages  # 移除独立包目录，避免上传冗余
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        retention-days: 30
        compression-level: 6

    # ==========================================
    # 1️⃣2️⃣ Generate GitHub Release
    # ==========================================
    - name: Generate release metadata
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        RELEASE_TAG="$(date +"%Y.%m.%d-%H%M")"
        echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
        
        # 生成 Release 说明
        cat > release.txt << EOF
        ## ✅ ImmortalWrt SP970 固件构建完成
        
        | 项目 | 值 |
        |------|-----|
        | 📦 设备 | \`${{ env.DEVICE_NAME }}\` |
        | 📅 构建时间 | $(date +"%Y-%m-%d %H:%M:%S") |
        | 🔧 源码分支 | \`${{ env.REPO_BRANCH }}\` |
        | 🏷️ 源码版本 | \`${{ env.OPENWRT_VERSION }}\` |
        | 🌐 内核 | 6.12.x (MSM8916) |
        | 💾 文件系统 | SquashFS + Ext4 Overlay (partexp 自动扩容) |
        
        ### 🚀 核心特性
        - ✅ 4G/5G Modem 支持 (QMI/MBIM)
        - ✅ Tailscale / ZeroTier / Cloudflare Tunnel
        - ✅ Daed 代理 + eBPF/XDP 加速
        - ✅ Podman 轻量容器引擎
        - ✅ 外部 USB WiFi/网卡驱动
        - ✅ LuCI 中文界面 + Argon 主题
        
        ### 📄 固件校验
        \`\`\`bash
        $(cd ${{ env.FIRMWARE }} && sha256sum *sysupgrade.bin 2>/dev/null || echo "Not found")
        \`\`\`
        
        > ⚠️ **首次刷入**：请使用 \`boot.img + system.img\` 通过 fastboot/flash.sh 刷入  
        > 🔁 **后续升级**：可直接使用 \`*-sysupgrade.bin\` 通过 LuCI 或 \`sysupgrade\` 命令在线升级
        EOF
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Publish firmware to GitHub Release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: "SP970 ImmortalWrt ${{ steps.tag.outputs.release_tag }}"
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE }}/*sysupgrade.bin
          ${{ env.FIRMWARE }}/*boot.img
          ${{ env.FIRMWARE }}/*system.img
          ${{ env.FIRMWARE }}/*.manifest
        draft: false
        prerelease: false
        make_latest: true
