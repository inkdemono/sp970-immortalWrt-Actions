name: SP970 ImmortalWrt Builder

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: '启用 TMate 远程调试 (true/false)'
        required: false
        default: 'false'

# 🔑 核心修复：授予 Release 创建与文件上传权限
permissions:
  contents: write
  actions: read

env:
  REPO_URL: https://github.com/inkdemono/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: sp970.config
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
          gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
          libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
          libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch \
          pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons \
          squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto \
          xxd zlib1g-dev mkbootimg img2simg
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /mnt/workdir
        sudo chown $USER:$GROUPS /mnt/workdir

    - name: Setup TMate Session (Optional Debug)
      if: github.event.inputs.debug_enabled == 'true'
      uses: mxschmitt/action-tmate@v3
      with:
        detached: true
        limit-access-to-actor: true

    - name: Clone source code
      working-directory: /mnt/workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /mnt/workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        cd openwrt
        # 添加第三方 feed 支持 daed, cloudflared, lucky 等
        echo "src-git daed https://github.com/sbwml/luci-app-daed" >> feeds.conf.default
        echo "src-git small https://github.com/kenzok8/small" >> feeds.conf.default
        echo "src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages" >> feeds.conf.default
        
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load diffconfig
      run: |
        [ -f "$CONFIG_FILE" ] && mv "$CONFIG_FILE" openwrt/.config || echo "⚠️ Config file not found, using default"

    - name: Pre-compile fixes (GCC14/musl & Podman)
      run: |
        cd openwrt
        # 🛡️ 规避 GCC 14 + musl + fortify-headers 导致的 gpgme 编译中断
        # Podman 仅依赖 gpgme 做镜像签名验证，家用场景可安全移除
        sed -i 's/+gpgme//' feeds/packages/utils/podman/Makefile 2>/dev/null || true
        # 清理旧缓存防止符号冲突
        rm -rf tmp/staging_dir/host* tmp/.config-package.in

    - name: Generate configuration
      run: |
        cd openwrt
        # 自动过滤无效符号，避免 make defconfig 交互阻塞或报错
        make defconfig 2>/dev/null || make olddefconfig 2>/dev/null || true
        
        # 验证关键配置是否生效
        if grep -q "CONFIG_TARGET_msm89xx_generic_DEVICE_sp970=y" .config; then
          echo "✅ SP970 device config loaded successfully"
        else
          echo "❌ SP970 device config missing, check sp970.config syntax"
          exit 1
        fi

    - name: Download package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \; || true

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "🧵 Threads: $(nproc)"
        # 多级降级编译策略，提高 CI 成功率
        make -j$(nproc) IGNORE_ERRORS=m || \
        make -j1 IGNORE_ERRORS=m || \
        make -j1 V=s IGNORE_ERRORS=m
        
        echo "status=success" >> $GITHUB_OUTPUT
        # 提取设备名用于命名
        DEVICE=$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' | head -1)
        echo "DEVICE_NAME=_${DEVICE:-sp970}" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        cat > release.txt << EOF
        ✅ **ImmortalWrt SP970 固件构建完成**
        📦 **设备**: `${{ env.DEVICE_NAME }}`
        📅 **构建时间**: $(date +"%Y-%m-%d %H:%M:%S")
        🔧 **内核**: 6.12.x (MSM8916)
        🌐 **特性**: SquashFS + Ext4 Overlay (partexp 自动扩容)
        🛡️ **已集成**: Tailscale / ZeroTier / Cloudflare Tunnel / Daed / Podman / eBPF / 外部网卡驱动
        
        📄 **固件校验**:
        \`\`\`
        $(sha256sum ${{ env.FIRMWARE }}/*sysupgrade.bin 2>/dev/null || echo "Not found")
        \`\`\`
        EOF
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*